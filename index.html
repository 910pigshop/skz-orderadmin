<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在日stay🧭代購 - 後台管理系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-serif-jp { font-family: 'Noto Serif JP', serif; }
    </style>
</head>
<body class="bg-[#FDFBF7] text-[#2C221E] min-h-screen flex flex-col antialiased">

    <!-- 後台頁首 -->
    <header class="bg-[#EFE6DC] text-[#2C221E] shadow-sm sticky top-0 z-40 border-b border-[#E3D5C5]">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold tracking-wider flex items-center gap-2 font-serif-jp text-[#4A3B32]">
                <i class="fa-solid fa-user-gear text-[#967259]"></i> <span>在日stay🧭後台管理系統</span>
            </h1>
            <div class="flex items-center gap-2">
                <a href="index.html" target="_blank" class="text-xs md:text-sm bg-[#F8F4EE] hover:bg-[#EFE6DC] text-[#4A3B32] px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 font-medium border border-[#E3D5C5]">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> 開啟前台
                </a>
            </div>
        </div>
    </header>

    <!-- 主要分頁切換區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">

        <!-- 導覽切換按鈕 -->
        <div class="flex gap-2 border-b border-[#E3D5C5] pb-2 overflow-x-auto">
            <button onclick="switchTab('orders')" id="tab-btn-orders" class="px-4 py-2 rounded-xl text-sm font-bold bg-[#967259] text-white transition shadow-sm cursor-pointer whitespace-nowrap">
                <i class="fa-solid fa-list-check"></i> 訂單管理
            </button>
            <button onclick="switchTab('products')" id="tab-btn-products" class="px-4 py-2 rounded-xl text-sm font-bold bg-[#F8F4EE] text-[#4A3B32] hover:bg-[#EFE6DC] transition border border-[#E3D5C5] cursor-pointer whitespace-nowrap">
                <i class="fa-solid fa-box"></i> 商品與庫存管理
            </button>
            <button onclick="switchTab('categories')" id="tab-btn-categories" class="px-4 py-2 rounded-xl text-sm font-bold bg-[#F8F4EE] text-[#4A3B32] hover:bg-[#EFE6DC] transition border border-[#E3D5C5] cursor-pointer whitespace-nowrap">
                <i class="fa-solid fa-tags"></i> 分類管理
            </button>
            <button onclick="switchTab('bank')" id="tab-btn-bank" class="px-4 py-2 rounded-xl text-sm font-bold bg-[#F8F4EE] text-[#4A3B32] hover:bg-[#EFE6DC] transition border border-[#E3D5C5] cursor-pointer whitespace-nowrap">
                <i class="fa-solid fa-building-columns"></i> 匯款帳號設定
            </button>
        </div>

        <!-- 1. 訂單管理分頁 -->
        <div id="tab-orders" class="space-y-4">
            <!-- 篩選與匯出工具列 -->
            <div class="bg-white p-4 rounded-2xl border border-[#E3D5C5] shadow-sm flex flex-wrap gap-3 items-center justify-between">
                <div class="flex flex-wrap gap-2 items-center text-xs">
                    <div>
                        <label class="font-bold text-[#4A3B32]">狀態篩選：</label>
                        <select id="filter-order-status" onchange="renderOrdersTable()" class="px-2.5 py-1.5 border border-[#D7C4B7] rounded-xl bg-[#FDFBF7]">
                            <option value="ALL">全部狀態</option>
                            <option value="待查帳">待查帳</option>
                            <option value="已對帳">已對帳</option>
                            <option value="已採購">已採購</option>
                            <option value="已抵台">已抵台</option>
                            <option value="訂單已完成">訂單已完成</option>
                        </select>
                    </div>
                    <div>
                        <label class="font-bold text-[#4A3B32]">分類篩選：</label>
                        <select id="filter-order-category" onchange="renderOrdersTable()" class="px-2.5 py-1.5 border border-[#D7C4B7] rounded-xl bg-[#FDFBF7]">
                            <option value="ALL">全部分類</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="exportOrdersToCSV()" class="bg-[#EFE6DC] hover:bg-[#E3D5C5] text-[#4A3B32] px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer border border-[#D7C4B7]">
                        <i class="fa-solid fa-file-excel text-emerald-700"></i> 匯出財務試算表
                    </button>
                    <button onclick="exportQueueToCSV()" class="bg-[#967259] hover:bg-[#634832] text-white px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer shadow-sm">
                        <i class="fa-solid fa-list-ol"></i> 匯出現場採購排單表
                    </button>
                </div>
            </div>

            <!-- 訂單列表 -->
            <div id="orders-list-container" class="space-y-3">
                <div class="text-center py-12 text-[#A08D7D]">載入訂單資料中...</div>
            </div>
        </div>

        <!-- 2. 商品管理分頁 -->
        <div id="tab-products" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-[#4A3B32]">商品列表與規格庫存</h2>
                <button onclick="openProductModal()" class="bg-[#967259] hover:bg-[#634832] text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer shadow-sm">
                    <i class="fa-solid fa-plus"></i> 新增商品
                </button>
            </div>
            <div id="products-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>

        <!-- 3. 分類管理分頁 -->
        <div id="tab-categories" class="hidden space-y-4 max-w-xl">
            <div class="bg-white p-4 rounded-2xl border border-[#E3D5C5] shadow-sm space-y-3">
                <h3 class="font-bold text-sm text-[#4A3B32]">新增分類</h3>
                <div class="flex gap-2">
                    <input type="text" id="new-category-name" placeholder="請輸入分類名稱 (例如: 娃娃, 小卡)" class="flex-grow px-3 py-1.5 border border-[#D7C4B7] rounded-xl text-xs bg-[#FDFBF7]">
                    <button onclick="addCategory()" class="bg-[#967259] hover:bg-[#634832] text-white px-4 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer">新增</button>
                </div>
            </div>
            <div id="categories-list-container" class="bg-white rounded-2xl border border-[#E3D5C5] p-4 divide-y divide-[#E3D5C5]"></div>
        </div>

        <!-- 4. 銀行帳號管理分頁 -->
        <div id="tab-bank" class="hidden space-y-4 max-w-xl">
            <div class="bg-white p-5 rounded-2xl border border-[#E3D5C5] shadow-sm space-y-4">
                <h3 class="font-bold text-sm text-[#4A3B32]">官方收款帳號設定</h3>
                <div id="bank-accounts-form-list" class="space-y-3"></div>
                <button onclick="addBankFormRow()" class="w-full bg-[#EFE6DC] text-[#4A3B32] py-2 rounded-xl text-xs font-bold border border-[#D7C4B7] hover:bg-[#E3D5C5] transition cursor-pointer">
                    + 新增一組收款帳號
                </button>
                <button onclick="saveBankAccounts()" class="w-full bg-[#967259] text-white py-2.5 rounded-xl text-xs font-bold hover:bg-[#634832] transition shadow-sm cursor-pointer">
                    儲存銀行帳號設定
                </button>
            </div>
        </div>

    </main>

    <!-- 商品 Modal (新增/編輯，含自動下架時間) -->
    <div id="product-modal" class="fixed inset-0 bg-[#2C221E]/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#FDFBF7] rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden border border-[#E3D5C5]">
            <div class="p-4 border-b border-[#E3D5C5] flex justify-between items-center bg-[#F8F4EE]">
                <h3 id="product-modal-title" class="font-bold text-base text-[#4A3B32]">新增商品</h3>
                <button onclick="closeProductModal()" class="text-[#A08D7D] hover:text-[#4A3B32] text-xl font-bold cursor-pointer">&times;</button>
            </div>
            <form onsubmit="saveProduct(event)" class="p-5 overflow-y-auto space-y-4 flex-grow text-xs">
                <div>
                    <label class="block font-bold text-[#4A3B32] mb-1">商品名稱 *</label>
                    <input type="text" id="prod-name" required class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl bg-white">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-[#4A3B32] mb-1">所屬分類 *</label>
                        <select id="prod-category" required class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl bg-white"></select>
                    </div>
                    <div>
                        <label class="block font-bold text-[#4A3B32] mb-1">📅 自動下架時間 (選填)</label>
                        <input type="datetime-local" id="prod-off-time" class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl bg-white">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-[#4A3B32] mb-1">圖片網址 (可用 Google Drive 共用連結，一行一張)</label>
                    <textarea id="prod-images" rows="2" placeholder="https://drive.google.com/file/d/..." class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl bg-white font-mono text-[11px]"></textarea>
                </div>

                <!-- 規格列表 -->
                <div class="space-y-2 pt-2 border-t border-[#E3D5C5]">
                    <div class="flex justify-between items-center">
                        <label class="font-bold text-[#967259]">款式規格與庫存</label>
                        <button type="button" onclick="addVariantRow()" class="text-[#967259] font-bold hover:underline">+ 新增款式</button>
                    </div>
                    <div id="variants-container" class="space-y-2"></div>
                </div>

                <div class="flex gap-2 pt-3">
                    <button type="button" onclick="closeProductModal()" class="w-1/3 bg-[#EFE6DC] text-[#4A3B32] py-2.5 rounded-xl font-bold">取消</button>
                    <button type="submit" class="w-2/3 bg-[#967259] text-white py-2.5 rounded-xl font-bold shadow-sm">儲存商品</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase 腳本串接 -->
    <script type="module">
        import * as FirebaseApp from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import * as Firestore from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWDdtm4XFr7GRrvWPvndEFczp3o0T5T10",
            authDomain: "skz-0801.firebaseapp.com",
            projectId: "skz-0801",
            storageBucket: "skz-0801.firebasestorage.app",
            messagingSenderId: "520589716798",
            appId: "1:520589716798:web:cfe79151e459a3ffb1106f",
            measurementId: "G-K00NJL3LKJ"
        };

        const app = FirebaseApp.initializeApp(firebaseConfig);
        const db = Firestore.getFirestore(app);

        let ordersCache = [];
        let productsCache = [];
        let categoriesCache = [];
        let editingProductId = null;
        let bankAccountsCache = [];

        function convertGoogleDriveUrl(url) {
            if (!url) return '';
            url = url.trim();
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
            return url;
        }

        // 監聽 categories
        Firestore.onSnapshot(Firestore.collection(db, "categories"), (snapshot) => {
            categoriesCache = [];
            snapshot.forEach(d => categoriesCache.push({ id: d.id, ...d.data() }));
            renderCategoriesTab();
            updateCategoryDropdowns();
        });

        // 監聽 products
        Firestore.onSnapshot(Firestore.collection(db, "products"), (snapshot) => {
            productsCache = [];
            snapshot.forEach(d => productsCache.push({ id: d.id, ...d.data() }));
            renderProductsTab();
        });

        // 監聽 orders
        Firestore.onSnapshot(Firestore.collection(db, "orders"), (snapshot) => {
            ordersCache = [];
            snapshot.forEach(d => ordersCache.push({ id: d.id, ...d.data() }));
            renderOrdersTable();
        });

        // 監聽 settings/bank
        Firestore.onSnapshot(Firestore.doc(db, "settings", "bank"), (docSnap) => {
            if (docSnap.exists()) {
                bankAccountsCache = docSnap.data().accounts || [];
            } else {
                bankAccountsCache = [{ name: '中國信託', account: '822-123456789' }];
            }
            renderBankAccountsForm();
        });

        window.switchTab = function(tabName) {
            ['orders', 'products', 'categories', 'bank'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).className = "px-4 py-2 rounded-xl text-sm font-bold bg-[#F8F4EE] text-[#4A3B32] hover:bg-[#EFE6DC] transition border border-[#E3D5C5] cursor-pointer whitespace-nowrap";
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tabName}`).className = "px-4 py-2 rounded-xl text-sm font-bold bg-[#967259] text-white transition shadow-sm cursor-pointer whitespace-nowrap";
        };

        /* ------------------ 1. 訂單管理與新到舊排序 ------------------ */
        window.renderOrdersTable = function() {
            const statusFilter = document.getElementById('filter-order-status').value;
            const categoryFilter = document.getElementById('filter-order-category').value;
            const container = document.getElementById('orders-list-container');

            let list = [...ordersCache];

            // 核心功能：強制依據下單時間由新到舊排序 (最新下單排最上面)
            list.sort((a, b) => {
                const timeA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
                const timeB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
                return timeB - timeA; // 降序
            });

            if (statusFilter !== 'ALL') list = list.filter(o => o.status === statusFilter);
            if (categoryFilter !== 'ALL') list = list.filter(o => o.items && o.items.some(i => i.category === categoryFilter));

            if (list.length === 0) {
                container.innerHTML = '<div class="bg-white p-8 rounded-2xl text-center text-[#A08D7D] text-xs">目前無符合條件的訂單</div>';
                return;
            }

            container.innerHTML = list.map(o => {
                const itemsHTML = (o.items || []).map(i => 
                    `<li class="flex justify-between ${i.isOutOfStock ? 'line-through text-rose-500' : ''}">
                        <span>• [${i.category || '選物'}] ${i.name} (${i.variantName}) x ${i.quantity}</span>
                        <span>NT$ ${(i.price * i.quantity).toLocaleString()}</span>
                    </li>`
                ).join('');

                return `
                <div class="bg-white p-4 rounded-2xl border border-[#E3D5C5] shadow-sm space-y-3 text-xs">
                    <div class="flex flex-wrap justify-between items-center border-b border-[#E3D5C5] pb-2 gap-2">
                        <div class="font-bold text-[#967259] text-sm">${o.orderNo || o.id}</div>
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] text-[#7D6B5D]">${o.createdAt ? new Date(o.createdAt).toLocaleString() : ''}</span>
                            <select onchange="window.updateOrderStatus('${o.id}', this.value)" class="px-2 py-1 border border-[#D7C4B7] rounded-xl font-bold bg-[#FDFBF7]">
                                <option value="待查帳" ${o.status === '待查帳' ? 'selected' : ''}>待查帳</option>
                                <option value="已對帳" ${o.status === '已對帳' ? 'selected' : ''}>已對帳</option>
                                <option value="已採購" ${o.status === '已採購' ? 'selected' : ''}>已採購</option>
                                <option value="已抵台" ${o.status === '已抵台' ? 'selected' : ''}>已抵台</option>
                                <option value="訂單已完成" ${o.status === '訂單已完成' ? 'selected' : ''}>訂單已完成</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div class="space-y-1 bg-[#F8F4EE] p-3 rounded-xl border border-[#E3D5C5]">
                            <div><strong>LINE暱稱：</strong> ${o.groupNickname || '-'}</div>
                            <div><strong>IG帳號：</strong> ${o.socialAccount || '-'}</div>
                            <div><strong>匯款戶名：</strong> ${o.senderName || '-'} | <strong>末5碼：</strong> ${o.accountLastFive || '-'}</div>
                            <div><strong>實際匯款：</strong> <span class="font-bold text-emerald-800">NT$ ${(o.payAmount || 0).toLocaleString()}</span></div>
                        </div>
                        <div class="space-y-1 bg-[#F8F4EE] p-3 rounded-xl border border-[#E3D5C5]">
                            <ul class="space-y-1">${itemsHTML}</ul>
                        </div>
                    </div>
                    <div class="flex flex-wrap justify-between items-center pt-1 border-t border-[#E3D5C5] gap-2">
                        <div class="flex items-center gap-2">
                            <label class="font-bold text-[#4A3B32]">包裹重量(kg):</label>
                            <input type="text" value="${o.weight || ''}" onchange="window.updateOrderWeight('${o.id}', this.value)" class="w-20 px-2 py-1 border border-[#D7C4B7] rounded-xl bg-[#FDFBF7] text-center font-bold">
                        </div>
                        <button onclick="window.deleteOrder('${o.id}')" class="text-rose-500 font-bold hover:underline">刪除訂單</button>
                    </div>
                </div>`;
            }).join('');
        };

        window.updateOrderStatus = async function(id, status) {
            await Firestore.updateDoc(Firestore.doc(db, "orders", id), { status });
        };

        window.updateOrderWeight = async function(id, weight) {
            await Firestore.updateDoc(Firestore.doc(db, "orders", id), { weight });
        };

        window.deleteOrder = async function(id) {
            if (confirm("確定要刪除此訂單嗎？")) {
                await Firestore.deleteDoc(Firestore.doc(db, "orders", id));
            }
        };

        /* ------------------ 採購排單 CSV 匯出 (縱向依下單時間排序 + 尾端總計) ------------------ */
        window.exportQueueToCSV = function() {
            const statusFilter = document.getElementById('filter-order-status').value;
            const categoryFilter = document.getElementById('filter-order-category').value;

            let targetOrders = ordersCache.filter(o => o.status !== '訂單已完成');
            if (statusFilter !== 'ALL') targetOrders = targetOrders.filter(o => o.status === statusFilter);
            if (categoryFilter !== 'ALL') targetOrders = targetOrders.filter(o => o.items && o.items.some(i => i.category === categoryFilter));

            if (targetOrders.length === 0) return alert('目前無符合條件的排單資料。');

            const queueList = [];
            const summaryMap = {};

            targetOrders.forEach(o => {
                const rawTimeStamp = o.createdAt ? new Date(o.createdAt).getTime() : 0;
                const formattedTime = o.createdAt ? new Date(o.createdAt).toLocaleString() : '';

                (o.items || []).forEach(i => {
                    if (!i.isOutOfStock) {
                        if (categoryFilter !== 'ALL' && i.category !== categoryFilter) return;

                        queueList.push({
                            prodName: i.name,
                            variantName: i.variantName,
                            qty: i.quantity,
                            time: formattedTime,
                            nickname: o.groupNickname || '',
                            senderName: o.senderName || '',
                            rawTime: rawTimeStamp
                        });

                        const sumKey = `${i.name} | ${i.variantName}`;
                        if (!summaryMap[sumKey]) {
                            summaryMap[sumKey] = { prodName: i.name, variantName: i.variantName, totalQty: 0 };
                        }
                        summaryMap[sumKey].totalQty += i.quantity;
                    }
                });
            });

            if (queueList.length === 0) return alert('目前無可排單的商品。');

            // 嚴格排序：商品名稱聚在一起，同一商品內依下單時間 rawTime 由舊到新
            queueList.sort((a, b) => {
                const prodComp = a.prodName.localeCompare(b.prodName);
                if (prodComp !== 0) return prodComp;
                if (a.rawTime !== b.rawTime) return a.rawTime - b.rawTime;
                return a.variantName.localeCompare(b.variantName);
            });

            let csvContent = "\uFEFF";
            csvContent += "=== 詳細購買排單順序名單 ===\n";
            csvContent += "商品名稱,款式規格,數量,下單時間,LINE群組暱稱,買家姓名\n";

            queueList.forEach(item => {
                csvContent += `"${item.prodName.replace(/"/g, '""')}","${item.variantName.replace(/"/g, '""')}",${item.qty},"${item.time}","${item.nickname.replace(/"/g, '""')}","${item.senderName.replace(/"/g, '""')}"\n`;
            });

            csvContent += "\n\n=== 各品項與款式採購總計 ===\n";
            csvContent += "商品名稱,款式規格,總需求數量\n";

            const sortedSummary = Object.values(summaryMap).sort((a, b) => 
                a.prodName.localeCompare(b.prodName) || a.variantName.localeCompare(b.variantName)
            );

            sortedSummary.forEach(s => {
                csvContent += `"${s.prodName.replace(/"/g, '""')}","${s.variantName.replace(/"/g, '""')}",${s.totalQty}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `STAY代購_現場採購排單表_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.exportOrdersToCSV = function() {
            let csvContent = "\uFEFF訂單編號,下單時間,狀態,LINE暱稱,IG帳號,戶名,帳號末5碼,實匯金額,商品總額,商品明細\n";
            ordersCache.forEach(o => {
                const itemsStr = (o.items || []).map(i => `${i.name}(${i.variantName})x${i.quantity}`).join('; ');
                csvContent += `"${o.orderNo || o.id}","${o.createdAt || ''}","${o.status || ''}","${o.groupNickname || ''}","${o.socialAccount || ''}","${o.senderName || ''}","'${o.accountLastFive || ''}",${o.payAmount || 0},${o.totalAmount || 0},"${itemsStr}"\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", `STAY代購_財務對帳表_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        /* ------------------ 2. 商品管理與自動下架時間 ------------------ */
        window.renderProductsTab = function() {
            const container = document.getElementById('products-list-container');
            if (productsCache.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-[#A08D7D] text-xs">目前無商品</div>';
                return;
            }

            container.innerHTML = productsCache.map(p => {
                const img = (p.images && p.images[0]) ? convertGoogleDriveUrl(p.images[0]) : '';
                const variantsStr = (p.variants || []).map(v => `${v.name}: NT$${v.price} (庫存:${v.stock})`).join('<br>');
                const offTimeStr = p.offTime ? new Date(p.offTime).toLocaleString() : '未設定 (永久上架)';

                return `
                <div class="bg-white p-4 rounded-2xl border border-[#E3D5C5] shadow-sm space-y-3 text-xs flex flex-col justify-between">
                    <div class="space-y-2">
                        <div class="h-36 bg-[#F8F4EE] rounded-xl overflow-hidden flex items-center justify-center">
                            ${img ? `<img src="${img}" class="max-h-full max-w-full object-contain">` : '<span class="text-[#A08D7D]">無圖片</span>'}
                        </div>
                        <span class="bg-[#F3E8DB] px-2 py-0.5 rounded font-bold text-[#7D6B5D]">${p.category || '選物'}</span>
                        <h3 class="font-bold text-sm text-[#2C221E]">${p.name}</h3>
                        <div class="text-[11px] text-[#7D6B5D] bg-[#F8F4EE] p-2 rounded-xl border border-[#E3D5C5]">${variantsStr}</div>
                        <div class="text-[10px] text-rose-700 font-bold">📅 下架時間: ${offTimeStr}</div>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-[#E3D5C5]">
                        <button onclick="window.openProductModal('${p.id}')" class="flex-grow bg-[#EFE6DC] text-[#4A3B32] py-1.5 rounded-xl font-bold">編輯</button>
                        <button onclick="window.deleteProduct('${p.id}')" class="text-rose-500 font-bold px-2">刪除</button>
                    </div>
                </div>`;
            }).join('');
        };

        window.openProductModal = function(productId = null) {
            editingProductId = productId;
            const modal = document.getElementById('product-modal');
            const title = document.getElementById('product-modal-title');
            const container = document.getElementById('variants-container');

            updateCategoryDropdowns();
            container.innerHTML = '';

            if (productId) {
                title.textContent = '編輯商品';
                const p = productsCache.find(x => x.id === productId);
                document.getElementById('prod-name').value = p.name || '';
                document.getElementById('prod-category').value = p.category || '';
                document.getElementById('prod-off-time').value = p.offTime || '';
                document.getElementById('prod-images').value = (p.images || []).join('\n');

                (p.variants || []).forEach(v => addVariantRow(v.name, v.price, v.deposit, v.stock));
            } else {
                title.textContent = '新增商品';
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-off-time').value = '';
                document.getElementById('prod-images').value = '';
                addVariantRow('標準規格', 0, 0, 99);
            }

            modal.classList.remove('hidden');
        };

        window.closeProductModal = function() { document.getElementById('product-modal').classList.add('hidden'); };

        window.addVariantRow = function(name = '', price = 0, deposit = 0, stock = 99) {
            const container = document.getElementById('variants-container');
            const div = document.createElement('div');
            div.className = "grid grid-cols-4 gap-1.5 items-center variant-row";
            div.innerHTML = `
                <input type="text" placeholder="規格名稱" value="${name}" required class="v-name px-2 py-1 border border-[#D7C4B7] rounded-lg">
                <input type="number" placeholder="售價" value="${price}" required class="v-price px-2 py-1 border border-[#D7C4B7] rounded-lg">
                <input type="number" placeholder="訂金" value="${deposit}" required class="v-deposit px-2 py-1 border border-[#D7C4B7] rounded-lg">
                <div class="flex gap-1 items-center">
                    <input type="number" placeholder="庫存" value="${stock}" required class="v-stock w-full px-2 py-1 border border-[#D7C4B7] rounded-lg">
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-rose-500 font-bold">&times;</button>
                </div>
            `;
            container.appendChild(div);
        };

        window.saveProduct = async function(e) {
            e.preventDefault();
            const name = document.getElementById('prod-name').value.trim();
            const category = document.getElementById('prod-category').value;
            const offTime = document.getElementById('prod-off-time').value;
            const imagesRaw = document.getElementById('prod-images').value.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            const variantRows = document.querySelectorAll('.variant-row');
            const variants = [];
            variantRows.forEach(row => {
                variants.push({
                    name: row.querySelector('.v-name').value.trim() || '標準規格',
                    price: Number(row.querySelector('.v-price').value) || 0,
                    deposit: Number(row.querySelector('.v-deposit').value) || 0,
                    stock: Number(row.querySelector('.v-stock').value) || 0
                });
            });

            const productData = { name, category, offTime: offTime || null, images: imagesRaw, variants, active: true };

            if (editingProductId) {
                await Firestore.updateDoc(Firestore.doc(db, "products", editingProductId), productData);
            } else {
                await Firestore.addDoc(Firestore.collection(db, "products"), productData);
            }

            closeProductModal();
        };

        window.deleteProduct = async function(id) {
            if (confirm("確定刪除此商品嗎？")) {
                await Firestore.deleteDoc(Firestore.doc(db, "products", id));
            }
        };

        /* ------------------ 3. 分類管理 ------------------ */
        function updateCategoryDropdowns() {
            const selectProd = document.getElementById('prod-category');
            const selectFilter = document.getElementById('filter-order-category');

            const options = categoriesCache.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
            if (selectProd) selectProd.innerHTML = options || '<option value="選物">選物</option>';
            if (selectFilter) selectFilter.innerHTML = '<option value="ALL">全部分類</option>' + options;
        }

        function renderCategoriesTab() {
            const container = document.getElementById('categories-list-container');
            container.innerHTML = categoriesCache.map(c => `
                <div class="py-2.5 flex justify-between items-center text-xs">
                    <span class="font-bold text-[#4A3B32]">${c.name}</span>
                    <button onclick="window.deleteCategory('${c.id}')" class="text-rose-500 font-bold hover:underline">刪除</button>
                </div>
            `).join('');
        }

        window.addCategory = async function() {
            const input = document.getElementById('new-category-name');
            const name = input.value.trim();
            if (!name) return;
            await Firestore.addDoc(Firestore.collection(db, "categories"), { name });
            input.value = '';
        };

        window.deleteCategory = async function(id) {
            if (confirm("確定要刪除分類嗎？")) {
                await Firestore.deleteDoc(Firestore.doc(db, "categories", id));
            }
        };

        /* ------------------ 4. 銀行帳號設定 ------------------ */
        function renderBankAccountsForm() {
            const container = document.getElementById('bank-accounts-form-list');
            container.innerHTML = bankAccountsCache.map((b, idx) => `
                <div class="flex gap-2 items-center text-xs">
                    <input type="text" value="${b.name}" placeholder="銀行名稱" class="bank-name w-1/3 px-3 py-1.5 border border-[#D7C4B7] rounded-xl bg-white font-bold">
                    <input type="text" value="${b.account}" placeholder="帳號" class="bank-acc w-2/3 px-3 py-1.5 border border-[#D7C4B7] rounded-xl bg-white font-mono">
                    <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 font-bold p-1">&times;</button>
                </div>
            `).join('');
        }

        window.addBankFormRow = function() {
            const container = document.getElementById('bank-accounts-form-list');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center text-xs";
            div.innerHTML = `
                <input type="text" placeholder="銀行名稱" class="bank-name w-1/3 px-3 py-1.5 border border-[#D7C4B7] rounded-xl bg-white font-bold">
                <input type="text" placeholder="帳號" class="bank-acc w-2/3 px-3 py-1.5 border border-[#D7C4B7] rounded-xl bg-white font-mono">
                <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 font-bold p-1">&times;</button>
            `;
            container.appendChild(div);
        };

        window.saveBankAccounts = async function() {
            const names = document.querySelectorAll('.bank-name');
            const accs = document.querySelectorAll('.bank-acc');
            const accounts = [];
            names.forEach((n, idx) => {
                if (n.value.trim()) {
                    accounts.push({ name: n.value.trim(), account: accs[idx].value.trim() });
                }
            });

            await Firestore.setDoc(Firestore.doc(db, "settings", "bank"), { accounts });
            alert("銀行帳號設定已成功儲存！");
        };
    </script>
</body>
</html>
